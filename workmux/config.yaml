# workmux global config (symlinked to ~/.config/workmux/config.yaml)
# Reference: `workmux config reference`

nerdfont: true
agent: claude
merge_strategy: squash

# Sibling of the repo, shared with git-gtr worktrees
worktree_dir: ../{project}-worktrees

# tmux.conf owns the pill tab format and embeds #{@workmux_status} itself
status_format: false

panes:
  - command: <agent>
    focus: true
  - split: horizontal

files:
  symlink:
    # Share granted Claude permissions across worktrees
    - .claude/settings.local.json
